# AI 聚合规则 + 主流服务独立规则，作为补充
RULE-SET,https://raw.githubusercontent.com/iab0x00/ProxyRules/main/Rule/AI.txt,PROXY
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/OpenAI/OpenAI.list,PROXY
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Claude/Claude.list,PROXY
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Gemini/Gemini.list,PROXY
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Copilot/Copilot.list,PROXY

# =============================================================================
# 3. Spotify -> 当前所选代理节点
# =============================================================================
DOMAIN-SUFFIX,spotify.com,PROXY
DOMAIN-SUFFIX,spotifycdn.com,PROXY
DOMAIN-SUFFIX,spotifycdn.net,PROXY
DOMAIN-SUFFIX,scdn.co,PROXY
DOMAIN-SUFFIX,pscdn.co,PROXY
DOMAIN-SUFFIX,spoti.fi,PROXY
DOMAIN-KEYWORD,spotify,PROXY
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Spotify/Spotify.list,PROXY

# =============================================================================
# 4. 其他 Apple 服务 -> DIRECT
# Apple Music 已在上方优先匹配
# =============================================================================
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple.list,DIRECT

# =============================================================================
# 5. GitHub -> PROXY
# =============================================================================
DOMAIN-SUFFIX,github.com,PROXY
DOMAIN-SUFFIX,githubusercontent.com,PROXY
DOMAIN-SUFFIX,githubassets.com,PROXY

# =============================================================================
# 6. 局域网 / 中国大陆 -> DIRECT
# =============================================================================
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Lan/Lan.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/bacdown/rules/refs/heads/main/Shadowrocket/ChinaMax_Domain.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Shadowrocket/ChinaIPs/ChinaIPs.list,DIRECT
DOMAIN-SUFFIX,cn,DIRECT
GEOIP,CN,DIRECT

# =============================================================================
# 7. 其余全部 -> 当前所选代理节点
# PROXY = Shadowrocket 首页当前选择的代理服务器
# =============================================================================
FINAL,PROXY

[Host]
localhost = 127.0.0.1
