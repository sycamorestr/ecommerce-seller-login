DOMAIN-SUFFIX,moonshot.cn,AI

# =============================================================================
# 3. Spotify -> 固定 VPS
# =============================================================================
DOMAIN-SUFFIX,spotify.com,Spotify
DOMAIN-SUFFIX,spotifycdn.com,Spotify
DOMAIN-SUFFIX,spotifycdn.net,Spotify
DOMAIN-SUFFIX,spotify-everywhere.com,Spotify
DOMAIN-SUFFIX,scdn.co,Spotify
DOMAIN-SUFFIX,pscdn.co,Spotify
DOMAIN-SUFFIX,spoti.fi,Spotify
DOMAIN-KEYWORD,spotify,Spotify
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Spotify/Spotify.list,Spotify

# =============================================================================
# 4. 其他 Apple 服务 -> DIRECT
# Apple Intelligence 已在上方 AI 聚合规则中优先命中，所以仍会走固定 VPS。
# =============================================================================
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple.list,DIRECT

# =============================================================================
# 5. 局域网 / 中国大陆 -> DIRECT
# =============================================================================
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Lan/Lan.list,DIRECT
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaMax/ChinaMax_Domain.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaMax/ChinaMax.list,DIRECT
DOMAIN-SUFFIX,cn,DIRECT
GEOIP,CN,DIRECT
GEOIP,LAN,DIRECT,no-resolve

# =============================================================================
# 6. 其他未匹配国外流量 -> PROXY
# PROXY 默认仍然是固定 VPS。
# =============================================================================
FINAL,PROXY

[Host]
localhost = 127.0.0.1

[URL Rewrite]
^https?://(www.)?g.cn https://www.google.com 302
^https?://(www.)?google.cn https://www.google.com 302

