[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-seller-login"
version = "0.1.0"
description = "电商平台登录：影刀登录指令的 Playwright 移植。一个平台一个目录。"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.40",
  "selenium>=4.15",
  "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["platforms*", "banks*"]
exclude = ["vendor*"]
