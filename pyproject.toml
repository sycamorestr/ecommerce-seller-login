[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-seller-login"
version = "0.1.0"
description = "电商平台登录：影刀登录指令的 Playwright 移植"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.40",
  "selenium>=4.15",
  "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
py-modules = [
  "qianniu_login",
  "qianniu_login_pw",
  "seller_common",
  "captcha_helpers",
  "jingmai_login_pw",
  "pdd_login_pw",
  "doudian_login_pw",
  "alipay_login_pw",
  "oceanengine_login_pw",
  "oceanengine_email_login_pw",
  "oceanengine_zongheng_login_pw",
  "youzan_login_pw",
  "jd_login_pw",
  "jzt_login_pw",
  "taobao_login_pw",
  "taobao_mini_login_pw",
  "compass_login_pw",
  "compass_strategy_login_pw",
  "aikucun_login_pw",
  "wangdiantong_login_pw",
  "alimama_login_pw",
  "pdd_promote_login_pw",
  "pdd_mms_legacy_login_pw",
  "login_1688_pw",
  "tmall_supermarket_login_pw",
  "cookie_login_pw",
]
